<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GridX - Registration Form</title>

    <style>

        /* ================= GLOBAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            overflow-x: hidden;
        }


        /* ================= NAVBAR ================= */

        nav {
            width: 100%;
            min-height: 70px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 7%;

            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);

            position: sticky;
            top: 0;
            z-index: 1000;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;

            animation: logoGlow 2s infinite alternate;
        }

        .logo span {
            color: #f97316;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;

            transition: 0.3s;

            position: relative;
        }

        nav ul li a::after {
            content: "";

            position: absolute;

            width: 0;
            height: 2px;

            background: #38bdf8;

            bottom: -6px;
            left: 0;

            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        nav ul li a:hover::after {
            width: 100%;
        }


        /* ================= HERO HEADER ================= */

        .header {
            text-align: center;

            padding: 70px 20px 40px;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(56, 189, 248, 0.2),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(249, 115, 22, 0.2),
                    transparent 30%
                );
        }

        .header h1 {
            font-size: clamp(40px, 6vw, 65px);

            margin-bottom: 15px;

            color: white;
        }

        .header h1 span {
            color: #38bdf8;
        }

        .header p {
            color: #94a3b8;

            font-size: 18px;

            line-height: 1.6;
        }


        /* ================= FORM CONTAINER ================= */

        main {
            width: 90%;
            max-width: 900px;

            margin: 20px auto 80px;

            padding: 40px;

            background: #1e293b;

            border-radius: 25px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            animation: formAppear 1s ease;
        }


        /* ================= FIELDSETS ================= */

        fieldset {
            border: 1px solid rgba(56, 189, 248, 0.25);

            border-radius: 20px;

            margin-bottom: 30px;

            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(30, 41, 59, 0.95),
                    rgba(15, 23, 42, 0.95)
                );

            transition: 0.4s;
        }

        fieldset:hover {
            transform: translateY(-5px);

            border-color: #38bdf8;

            box-shadow:
                0 15px 40px rgba(56, 189, 248, 0.12);
        }

        legend {
            padding: 9px 20px;

            border-radius: 20px;

            color: white;

            background:
                linear-gradient(
                    45deg,
                    #0284c7,
                    #38bdf8
                );

            box-shadow:
                0 5px 20px rgba(56, 189, 248, 0.25);

            font-weight: bold;
        }


        /* ================= LABELS ================= */

        label {
            color: #cbd5e1;

            font-weight: 600;

            transition: 0.3s;
        }

        label:hover {
            color: #38bdf8;
        }


        /* ================= INPUTS ================= */

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {

            width: 100%;

            max-width: 650px;

            margin-top: 8px;

            padding: 13px 15px;

            border: 2px solid #334155;

            border-radius: 10px;

            background: #0f172a;

            color: white;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.3s,
                box-shadow 0.3s,
                transform 0.2s,
                background 0.3s;
        }


        /* ================= INPUT FOCUS ================= */

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {

            border-color: #38bdf8;

            background: #111c30;

            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.12),
                0 8px 25px rgba(56, 189, 248, 0.08);

            transform: translateY(-2px);
        }


        /* ================= PLACEHOLDER ================= */

        input::placeholder,
        textarea::placeholder {
            color: #64748b;

            transition: 0.3s;
        }

        input:focus::placeholder,
        textarea:focus::placeholder {
            opacity: 0.4;
        }


        /* ================= SELECT ================= */

        select {
            cursor: pointer;
        }

        select option {
            background: #0f172a;
            color: white;
        }


        /* ================= RADIO / CHECKBOX ================= */

        input[type="radio"],
        input[type="checkbox"] {

            accent-color: #38bdf8;

            transform: scale(1.15);

            cursor: pointer;

            margin-right: 5px;

            transition: 0.2s;
        }

        input[type="radio"]:hover,
        input[type="checkbox"]:hover {
            transform: scale(1.3);
        }


        /* ================= FILE INPUT ================= */

        input[type="file"] {
            cursor: pointer;

            background: #0f172a;
        }

        input[type="file"]::file-selector-button {

            border: none;

            padding: 9px 15px;

            margin-right: 10px;

            border-radius: 8px;

            background:
                linear-gradient(
                    45deg,
                    #0284c7,
                    #38bdf8
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        input[type="file"]::file-selector-button:hover {

            transform: scale(1.05);

            box-shadow:
                0 5px 20px rgba(56, 189, 248, 0.4);
        }


        /* ================= DECLARATION ================= */

        .declaration {

            background:
                linear-gradient(
                    135deg,
                    rgba(2, 132, 199, 0.15),
                    rgba(124, 58, 237, 0.15)
                );
        }


        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;
        }

        input[type="submit"],
        input[type="reset"] {

            border: none;

            padding: 14px 30px;

            border-radius: 30px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            color: white;

            transition: 0.4s;
        }


        /* Submit */

        input[type="submit"] {

            background:
                linear-gradient(
                    45deg,
                    #0284c7,
                    #38bdf8
                );

            box-shadow:
                0 8px 25px rgba(56, 189, 248, 0.3);
        }


        /* Reset */

        input[type="reset"] {

            background:
                linear-gradient(
                    45deg,
                    #ea580c,
                    #f97316
                );

            box-shadow:
                0 8px 25px rgba(249, 115, 22, 0.25);
        }


        /* Button Hover */

        input[type="submit"]:hover,
        input[type="reset"]:hover {

            transform:
                translateY(-5px)
                scale(1.05);

            box-shadow:
                0 15px 35px rgba(56, 189, 248, 0.4);
        }

        input[type="reset"]:hover {
            box-shadow:
                0 15px 35px rgba(249, 115, 22, 0.4);
        }


        /* ================= BACK BUTTON ================= */

        .back-home {

            display: block;

            width: fit-content;

            margin: 0 auto 30px;

            padding: 12px 25px;

            border-radius: 30px;

            color: white;

            text-decoration: none;

            background: #1e293b;

            border: 1px solid #334155;

            transition: 0.3s;
        }

        .back-home:hover {

            color: #38bdf8;

            border-color: #38bdf8;

            transform: translateY(-3px);
        }


        /* ================= FOOTER ================= */

        footer {

            padding: 40px 8%;

            text-align: center;

            background: #020617;

            color: #64748b;
        }

        footer span {
            color: #38bdf8;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes formAppear {

            from {
                opacity: 0;

                transform:
                    translateY(60px)
                    scale(0.95);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes logoGlow {

            from {
                text-shadow:
                    0 0 5px #38bdf8;
            }

            to {
                text-shadow:
                    0 0 20px #38bdf8,
                    0 0 40px #38bdf8;
            }
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            nav {

                padding: 20px;

                flex-direction: column;

                gap: 20px;
            }

            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }

            .header {

                padding:
                    50px 20px 30px;
            }

            main {

                width: 94%;

                padding: 20px;

                border-radius: 18px;
            }

            fieldset {

                padding: 20px;
            }

            .buttons {

                flex-direction: column;
            }

            input[type="submit"],
            input[type="reset"] {

                width: 100%;
            }
        }


        /* ================= REDUCED MOTION ================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>
</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            Grid<span>X</span>
        </div>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="index.html#about">
                    About
                </a>
            </li>

            <li>
                <a href="index.html#services">
                    Services
                </a>
            </li>

            <li>
                <a href="index.html#contact">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <h1>
            Grid<span>X</span> Registration
        </h1>

        <p>
            Register with GridX and become part of our community.
        </p>

    </header>


    <!-- ================= FORM ================= -->

    <main>

        <a href="index.html" class="back-home">
            ← Back to GridX
        </a>


        <form action="#" method="post" enctype="multipart/form-data">


            <!-- ================= PERSONAL INFORMATION ================= -->

            <fieldset>

                <legend>
                    Personal Information
                </legend>


                <label for="name">
                    Full Name:
                </label>

                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <br><br>


                <label for="father">
                    Father's Name:
                </label>

                <br>

                <input
                    type="text"
                    id="father"
                    name="father"
                    placeholder="Enter father's name"
                    required
                >

                <br><br>


                <label for="mother">
                    Mother's Name:
                </label>

                <br>

                <input
                    type="text"
                    id="mother"
                    name="mother"
                    placeholder="Enter mother's name"
                    required
                >

                <br><br>


                <label>
                    Gender:
                </label>

                <br>

                <input
                    type="radio"
                    id="male"
                    name="gender"
                    value="Male"
                    required
                >

                <label for="male">
                    Male
                </label>


                <input
                    type="radio"
                    id="female"
                    name="gender"
                    value="Female"
                >

                <label for="female">
                    Female
                </label>


                <input
                    type="radio"
                    id="other"
                    name="gender"
                    value="Other"
                >

                <label for="other">
                    Other
                </label>

                <br><br>


                <label for="dob">
                    Date of Birth:
                </label>

                <br>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >

                <br><br>


                <label for="nationality">
                    Nationality:
                </label>

                <br>

                <input
                    type="text"
                    id="nationality"
                    name="nationality"
                    value="Indian"
                >

            </fieldset>


            <!-- ================= CONTACT INFORMATION ================= -->

            <fieldset>

                <legend>
                    Contact Information
                </legend>


                <label for="email">
                    Email Address:
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>


                <label for="phone">
                    Mobile Number:
                </label>

                <br>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your mobile number"
                    required
                >

                <br><br>


                <label for="address">
                    Permanent Address:
                </label>

                <br>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your complete address"
                ></textarea>

                <br><br>


                <label for="city">
                    City:
                </label>

                <br>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter your city"
                >

                <br><br>


                <label for="state">
                    State:
                </label>

                <br>

                <input
                    type="text"
                    id="state"
                    name="state"
                    placeholder="Enter your state"
                >

                <br><br>


                <label for="pincode">
                    PIN Code:
                </label>

                <br>

                <input
                    type="text"
                    id="pincode"
                    name="pincode"
                    placeholder="Enter PIN code"
                >

            </fieldset>


            <!-- ================= DOCUMENTS ================= -->

            <fieldset>

                <legend>
                    Documents
                </legend>


                <label for="photo">
                    Upload Photograph:
                </label>

                <br>

                <input
                    type="file"
                    id="photo"
                    name="photo"
                    accept="image/*"
                >

                <br><br>


                <label for="idproof">
                    Upload ID Proof:
                </label>

                <br>

                <input
                    type="file"
                    id="idproof"
                    name="idproof"
                    accept=".pdf,.jpg,.jpeg,.png"
                >

                <br><br>


                <label for="document">
                    Upload Additional Document:
                </label>

                <br>

                <input
                    type="file"
                    id="document"
                    name="document"
                    accept=".pdf,.jpg,.jpeg,.png"
                >

            </fieldset>


            <!-- ================= DECLARATION ================= -->

            <fieldset class="declaration">

                <legend>
                    Declaration
                </legend>


                <input
                    type="checkbox"
                    id="declaration"
                    name="declaration"
                    required
                >

                <label for="declaration">

                    I hereby declare that the information
                    provided by me is true and correct to
                    the best of my knowledge.

                </label>

            </fieldset>


            <!-- ================= BUTTONS ================= -->

            <div class="buttons">

                <input
                    type="submit"
                    value="Submit Registration"
                >

                <input
                    type="reset"
                    value="Reset Form"
                >

            </div>


        </form>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026
            <span>GridX</span>
            | Registration Portal
        </p>

    </footer>


</body>

</html>
